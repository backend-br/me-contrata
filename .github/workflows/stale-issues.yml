name: Close stale issues

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: stale-issues
  cancel-in-progress: false

permissions: {}

jobs:
  stale:
    name: Close stale issues
    permissions:
      actions: write
      issues: write
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Mark and close stale issues
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93
        with:
          ascending: true
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: 'Este perfil está há 60 dias sem atualização. Se você ainda busca uma oportunidade, edite a issue ou faça um comentário. Caso contrário, ele será fechado automaticamente em 7 dias.'
          close-issue-message: 'Este perfil foi fechado por estar há muito tempo sem atualização. Para voltar a divulgá-lo, abra um perfil novo pelo formulário.'
          days-before-stale: 60
          days-before-close: 7
